<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Darkroom -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Title Crisp Linear Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Accent Neon Precision Gradients -->
    <linearGradient id="accentCyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>

    <linearGradient id="activeBufferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942"/>
      <stop offset="100%" stop-color="#0A1929"/>
    </linearGradient>

    <linearGradient id="wireframeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; font-weight: 800; }
    .font-mono { font-family: "SF Mono", "JetBrains Mono", "Roboto Mono", "Fira Code", monospace; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bannerBg)"/>

  <!-- Precision Technical Blueprint Grid -->
  <g opacity="0.35">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>

    <!-- Vertical Grid Lines -->
    <line x1="80" y1="0" x2="80" y2="420" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="340" y1="0" x2="340" y2="420" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="860" y1="0" x2="860" y2="420" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
    <line x1="1120" y1="0" x2="1120" y2="420" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="3,6"/>
  </g>

  <!-- Precision Crosshair Markers -->
  <g stroke="#334155" stroke-width="1.2">
    <path d="M 74,40 L 86,40 M 80,34 L 80,46" />
    <path d="M 594,40 L 606,40 M 600,34 L 600,46" />
    <path d="M 1114,40 L 1126,40 M 1120,34 L 1120,46" />
    <path d="M 74,360 L 86,360 M 80,354 L 80,366" />
    <path d="M 1114,360 L 1126,360 M 1120,354 L 1120,366" />
  </g>

  <!-- ==================== LEFT COLUMN: BRAND & SPECIFICATION ==================== -->
  
  <!-- Architectural Category Pill -->
  <g transform="translate(70, 52)">
    <rect width="310" height="26" rx="13" fill="#0B132B" stroke="#1D4ED8" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="1.5" fill="#93C5FD">ARCHITECTURE RFC • INFERENCE SYSTEMS</text>
  </g>

  <!-- Main Headline Title -->
  <text x="70" y="132" class="font-title" font-size="52" letter-spacing="-1.5" fill="url(#titleGrad)">STREAMSPEC</text>

  <!-- Technical Subtitle -->
  <text x="72" y="168" class="font-body" font-size="18.5" font-weight="600" fill="#E2E8F0">Asynchronous Speculative Layer-Streaming</text>
  <text x="72" y="196" class="font-body" font-size="14" font-weight="400" fill="#94A3B8">Breaking the Arithmetic Intensity Collapse for 70B &amp; DeepSeek-R1</text>

  <!-- Systems Physics Metric Badges -->
  <g transform="translate(72, 236)">
    <!-- Badge 1: K-GEMM Intensity -->
    <rect x="0" y="0" width="150" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="14" y="18" class="font-mono" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">INTENSITY GAIN</text>
    <text x="14" y="34" class="font-mono" font-size="13" font-weight="700" fill="#38BDF8">I = K × I_naive</text>

    <!-- Badge 2: Bus Traffic Reduction -->
    <rect x="162" y="0" width="150" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="176" y="18" class="font-mono" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">BUS TRAFFIC SAVED</text>
    <text x="176" y="34" class="font-mono" font-size="13" font-weight="700" fill="#2DD4BF">45.8% — 75.0%</text>

    <!-- Badge 3: MLA Latent Compression -->
    <rect x="324" y="0" width="150" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="338" y="18" class="font-mono" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">MLA KV CACHE</text>
    <text x="338" y="34" class="font-mono" font-size="13" font-weight="700" fill="#10B981">85.94% COMPRESSED</text>
  </g>

  <!-- Technical Spec Signature Line -->
  <g transform="translate(72, 320)">
    <text x="0" y="0" class="font-mono" font-size="11" fill="#475569">PROOF: <tspan fill="#64748B">Leviathan Exact Rejection Invariance (2023)</tspan>  •  STACK: <tspan fill="#64748B">Pure Python &amp; PyTorch</tspan></text>
    <text x="0" y="20" class="font-mono" font-size="11" fill="#475569">HARDWARE: <tspan fill="#64748B">Consumer Laptops (8GB–16GB VRAM) &amp; NVMe PCIe SSDs</tspan></text>
  </g>

  <!-- ==================== RIGHT COLUMN: ARCHITECTURAL SCHEMATIC ==================== -->
  
  <!-- Schematic Container Outer Frame -->
  <g transform="translate(580, 50)">
    <rect width="550" height="310" rx="16" fill="url(#boxGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Schematic Header bar -->
    <rect width="550" height="36" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#EF4444"/>
    <circle cx="34" cy="18" r="4" fill="#F59E0B"/>
    <circle cx="48" cy="18" r="4" fill="#10B981"/>
    <text x="70" y="22" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">SYSTEMS HARDWARE EXECUTION TOPOLOGY</text>

    <!-- Stage 1: Fast In-Memory Draft Scout -->
    <g transform="translate(25, 60)">
      <rect width="135" height="120" rx="8" fill="#090D16" stroke="#2563EB" stroke-width="1.2"/>
      <text x="14" y="24" class="font-mono" font-size="10" font-weight="700" fill="#60A5FA">DRAFT SCOUT</text>
      <text x="14" y="40" class="font-mono" font-size="8.5" fill="#64748B">In-Memory VRAM</text>
      <text x="14" y="56" class="font-mono" font-size="8.5" fill="#64748B">Model: 0.5B — 1.5B</text>
      
      <!-- Speculative Chunk Stream Generator -->
      <g transform="translate(14, 75)">
        <rect width="107" height="28" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
        <text x="8" y="18" class="font-mono" font-size="9" font-weight="700" fill="#38BDF8">K-Chunk [x₁..x₈]</text>
      </g>
    </g>

    <!-- Connecting Bus Vector 1 -->
    <g transform="translate(165, 110)">
      <path d="M 0,10 L 40,10" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3"/>
      <polygon points="40,6 48,10 40,14" fill="#38BDF8"/>
      <text x="4" y="0" class="font-mono" font-size="8" fill="#38BDF8">Async GEMM</text>
    </g>

    <!-- Stage 2: Target Streaming Layer Buffer Pool -->
    <g transform="translate(218, 60)">
      <rect width="170" height="150" rx="8" fill="url(#activeBufferGrad)" stroke="#0284C7" stroke-width="1.2"/>
      <text x="14" y="24" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8">LAYER BUFFER POOL</text>
      <text x="14" y="40" class="font-mono" font-size="8.5" fill="#94A3B8">Double-Buffered Prefetch</text>

      <!-- Buffer A -->
      <g transform="translate(14, 52)">
        <rect width="142" height="34" rx="4" fill="#0C1D33" stroke="#38BDF8" stroke-width="1"/>
        <circle cx="12" cy="17" r="3.5" fill="#10B981"/>
        <text x="24" y="21" class="font-mono" font-size="9" font-weight="600" fill="#E2E8F0">Buffer A: Exec Layer ℓ</text>
      </g>

      <!-- Buffer B -->
      <g transform="translate(14, 94)">
        <rect width="142" height="34" rx="4" fill="#0B132B" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
        <circle cx="12" cy="17" r="3.5" fill="#F59E0B"/>
        <text x="24" y="21" class="font-mono" font-size="9" font-weight="600" fill="#94A3B8">Buffer B: Prefetch (ℓ+1)</text>
      </g>

      <text x="14" y="142" class="font-mono" font-size="7.5" fill="#0284C7">Target (70B/R1) in NVMe SSD</text>
    </g>

    <!-- Connecting Bus Vector 2 -->
    <g transform="translate(393, 110)">
      <path d="M 0,10 L 32,10" stroke="#10B981" stroke-width="2"/>
      <polygon points="32,6 40,10 32,14" fill="#10B981"/>
      <text x="2" y="0" class="font-mono" font-size="8" fill="#10B981">Sweep</text>
    </g>

    <!-- Stage 3: Leviathan Verification & Token Output -->
    <g transform="translate(438, 60)">
      <rect width="90" height="120" rx="8" fill="#061A14" stroke="#059669" stroke-width="1.2"/>
      <text x="10" y="22" class="font-mono" font-size="8.5" font-weight="700" fill="#34D399">REJECTION</text>
      <text x="10" y="34" class="font-mono" font-size="8.5" font-weight="700" fill="#34D399">VERIFIER</text>

      <text x="10" y="52" class="font-mono" font-size="8" fill="#6EE7B7">α = min(1, p/q)</text>
      
      <g transform="translate(10, 70)">
        <rect width="70" height="36" rx="4" fill="#042F24" stroke="#10B981" stroke-width="1"/>
        <text x="10" y="16" class="font-mono" font-size="8" font-weight="700" fill="#A7F3D0">ACCEPTED</text>
        <text x="10" y="28" class="font-mono" font-size="9" font-weight="800" fill="#34D399">γ Tokens</text>
      </g>
    </g>

    <!-- Bottom Telemetry Ticker inside schematic -->
    <g transform="translate(25, 236)">
      <rect width="503" height="54" rx="8" fill="#080D1A" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="22" class="font-mono" font-size="9" font-weight="700" fill="#64748B">PHYSICAL BUS I/O METRICS (24 TOKENS VERIFIED):</text>
      
      <text x="16" y="40" class="font-mono" font-size="9.5" fill="#EF4444">Naive Single-Token: 24 Sweeps (73.9 GB)</text>
      <text x="250" y="40" class="font-mono" font-size="9.5" font-weight="700" fill="#10B981">StreamSpec: 13 Sweeps (40.0 GB) [-45.8%]</text>
    </g>
  </g>

  <!-- Bottom Accent Precision Line (Cyan to Emerald) -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentCyanEmerald)"/>
</svg>
