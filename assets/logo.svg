<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Speculative Beam Gradient (Cyan to Emerald) -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Layer Stack Gradients (Precision Slate) -->
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Glow Filter for the speculative vector -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base with Chamfered Corners -->
  <rect x="8" y="8" width="240" height="240" rx="36" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Blueprint Tech Grid Coordinates -->
  <path d="M 40,8 L 40,248 M 216,8 L 216,248 M 8,40 L 248,40 M 8,216 L 248,216" stroke="#141E33" stroke-width="1" stroke-dasharray="4,6"/>
  <circle cx="40" cy="40" r="2" fill="#334155"/>
  <circle cx="216" cy="40" r="2" fill="#334155"/>
  <circle cx="40" cy="216" r="2" fill="#334155"/>
  <circle cx="216" cy="216" r="2" fill="#334155"/>

  <!-- Layer Stack Geometry (The 3 Persistent Target Layers) -->
  <!-- Layer 3 (Bottom) -->
  <path d="M 52,168 L 136,128 L 204,168 L 120,208 Z" fill="url(#layerGrad2)" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Layer 2 (Middle - Prefetch Buffer) -->
  <path d="M 52,136 L 136,96 L 204,136 L 120,176 Z" fill="url(#layerGrad1)" stroke="#475569" stroke-width="1.5" opacity="0.85"/>
  
  <!-- Layer 1 (Top - Active Execution Buffer) -->
  <path d="M 52,104 L 136,64 L 204,104 L 120,144 Z" fill="url(#layerGrad2)" stroke="#64748B" stroke-width="1.5"/>

  <!-- Asynchronous Speculative Vector: S-Curved High-Speed Beam Piercing the Layers -->
  <!-- Back glow vector -->
  <path d="M 76,74 L 136,104 L 100,140 L 168,172" fill="none" stroke="#2DD4BF" stroke-width="8" opacity="0.25" filter="url(#softGlow)" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sharp core vector -->
  <path d="M 76,74 L 136,104 L 100,140 L 168,172" fill="none" stroke="url(#beamGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Speculative Chunk Pulse Nodes (Candidate Tokens) -->
  <circle cx="76" cy="74" r="5" fill="#38BDF8" stroke="#0B0F17" stroke-width="2"/>
  <circle cx="106" cy="89" r="4" fill="#38BDF8" stroke="#0B0F17" stroke-width="1.5"/>
  <circle cx="136" cy="104" r="6" fill="#2DD4BF" stroke="#0B0F17" stroke-width="2"/>
  <circle cx="118" cy="122" r="4" fill="#2DD4BF" stroke="#0B0F17" stroke-width="1.5"/>
  <circle cx="100" cy="140" r="5.5" fill="#10B981" stroke="#0B0F17" stroke-width="2"/>
  <circle cx="134" cy="156" r="4.5" fill="#10B981" stroke="#0B0F17" stroke-width="1.5"/>
  
  <!-- Verified Terminal Output Node (Accepted Token) -->
  <circle cx="168" cy="172" r="7.5" fill="#10B981" stroke="#F8FAFC" stroke-width="2.5" filter="url(#softGlow)"/>
  
  <!-- Top Tech Monogram Mark -->
  <text x="128" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#64748B">STREAMSPEC</text>
</svg>
