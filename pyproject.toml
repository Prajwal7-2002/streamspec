[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamspec"
version = "1.2.0"
authors = [
  { name="Prajwal7-2002", email="prajwalpujari16@gmail.com" },
]
description = "Asynchronous Speculative Layer-Streaming for Frontier & Futuristic AI"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[project.scripts]
streamspec = "streamspec.cli:main"

[project.urls]
Homepage = "https://github.com/Prajwal7-2002/streamspec"
Repository = "https://github.com/Prajwal7-2002/streamspec"
Documentation = "https://github.com/Prajwal7-2002/streamspec/blob/main/SPECIFICATION.md"
"Bug Tracker" = "https://github.com/Prajwal7-2002/streamspec/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
include = ["streamspec*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
