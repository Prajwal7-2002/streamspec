[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamspec"
version = "1.2.0"
authors = [
  { name="Prajwal7-2002", email="prajwalpujari16@gmail.com" },
]
description = "Asynchronous Speculative Layer-Streaming for Frontier & Futuristic AI"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
include = ["streamspec*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
